[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doekit"
version = "0.1.0"
description = "Design, analyse and optimise experiments for any process, from a single config file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=3.0,<4",
    "scipy>=1.15,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "pyDOE3>=1.6,<2",
    "mpltern>=1.0,<2",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
