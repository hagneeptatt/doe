# Runs every test on Windows, macOS and Linux whenever changes are pushed to GitHub.
# Results are on the repository's Actions tab, and failed tests are listed on each run's page.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      # The same conda environment people install, from conda-forge only.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: doe
          conda-remove-defaults: "true"

      - name: Check the environment
        run: |
          conda info --envs
          python -c "import sys, doekit, streamlit; print(sys.executable, doekit.__file__, streamlit.__version__)"

      - name: Run the tests
        run: python -m pytest -p no:logging -rfE --tb=short --junitxml=report.xml

      # Logs need a GitHub login to read, but these notes show on the run's public page.
      - name: List any failed tests
        if: always()
        run: |
          python - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          if not os.path.exists("report.xml"):
              print("::error::The tests didn't finish, so there is no report. See the log of the step above.")
              raise SystemExit
          suite = ET.parse("report.xml").getroot()
          suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
          counts = {key: suite.get(key) for key in ("tests", "failures", "errors", "skipped")}
          lines = []
          for case in suite.iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  message = (problem.get("message") or problem.text or "").strip().replace("\n", " ")[:400]
                  lines.append(f"{case.get('classname')}.{case.get('name')}: {message}")
          summary = f"{counts['tests']} tests, {counts['failures']} failed, {counts['errors']} errors, {counts['skipped']} skipped"
          if lines:
              print("::error title=" + summary + "::" + "%0A".join(lines[:40]))
          else:
              print("::notice title=Tests::" + summary)
          EOF

  # Installs doekit the way people without coding experience do, then updates it.
  installer:
    name: installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      DOEKIT_NO_START: "1"
      DOEKIT_PORT: "8598"
    steps:
      - uses: actions/checkout@v4

      - name: Install and update with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export DOEKIT_HOME="$RUNNER_TEMP/doekit" DOEKIT_ICON_FOLDER="$RUNNER_TEMP/Desktop"
          export DOEKIT_ARCHIVE="$RUNNER_TEMP/doekit.tar.gz"  # this version, rather than the latest release
          git archive --format=tar.gz --prefix=doe/ -o "$DOEKIT_ARCHIVE" HEAD
          cat install.sh | bash
          "$DOEKIT_HOME/env/bin/python" .github/check_install.py
          mkdir -p "$DOEKIT_HOME/doe/data/app_studies"
          printf "my study" > "$DOEKIT_HOME/doe/data/app_studies/kept.txt"
          cat install.sh | bash
          "$DOEKIT_HOME/env/bin/python" .github/check_install.py --after-update

      - name: Install and update with install.ps1
        if: runner.os == 'Windows'
        shell: powershell  # Windows PowerShell, which is what people have
        run: |
          $env:DOEKIT_HOME = Join-Path $env:RUNNER_TEMP "doekit"
          $env:DOEKIT_ICON_FOLDER = Join-Path $env:RUNNER_TEMP "Desktop"
          $env:DOEKIT_ARCHIVE = Join-Path $env:RUNNER_TEMP "doekit.zip"  # this version, rather than the latest release
          git archive --format=zip --prefix=doe/ -o $env:DOEKIT_ARCHIVE HEAD
          Get-Content install.ps1 -Raw | Invoke-Expression
          if ($global:DoekitInstallFailed) { exit 1 }
          & "$env:DOEKIT_HOME\env\python.exe" .github\check_install.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path "$env:DOEKIT_HOME\doe\data\app_studies" | Out-Null
          Set-Content -NoNewline -Path "$env:DOEKIT_HOME\doe\data\app_studies\kept.txt" -Value "my study"
          Get-Content install.ps1 -Raw | Invoke-Expression
          if ($global:DoekitInstallFailed) { exit 1 }
          & "$env:DOEKIT_HOME\env\python.exe" .github\check_install.py --after-update
          if ($LASTEXITCODE -ne 0) { exit 1 }
